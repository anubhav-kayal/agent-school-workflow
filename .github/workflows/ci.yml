name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admissionpilot
          POSTGRES_PASSWORD: admissionpilot
          POSTGRES_DB: admissionpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admissionpilot"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://admissionpilot:admissionpilot@localhost:5432/admissionpilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://admissionpilot:admissionpilot@localhost:5432/admissionpilot_test
      REDIS_URL: redis://localhost:6379/0
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Test
        run: make test
